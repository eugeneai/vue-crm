[app:main]
use = egg:backend

# URL базы данных
sqlalchemy.url = sqlite:///../database/contacts.db

# Настройки Pyramid
pyramid.reload_templates = true
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.default_locale_name = en
pyramid.includes =
    pyramid_debugtoolbar

# Настройки GraphQL
graphql.enable_playground = true
graphql.debug = true

# Настройки сессий
session.type = memory
session.key = web_is_vue.session
session.secret = ${WEB_IS_VUE_SESSION_SECRET:change_this_secret_key}

# Настройки логирования
[loggers]
keys = root, web_is_vue

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_web_is_vue]
level = DEBUG
handlers = console
qualname = web_is_vue
propagate = 0

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s][%(threadName)s] %(message)s

# Переменные окружения (пример)
# WEB_IS_VUE_SESSION_SECRET = your_secret_key_here
# DATABASE_URL = sqlite:///../database/contacts.db